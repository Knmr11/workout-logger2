<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>筋トレ記録</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --blue:#0b6ef3;--danger:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:92px}
header{position:sticky;top:0;z-index:5;background:rgba(244,246,248,.95);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.label{font-size:13px;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input,button{font:inherit}
select,input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:17px}
button{border:0;border-radius:14px;padding:14px 16px;background:var(--blue);color:#fff;font-weight:700;font-size:17px}
button.secondary{background:#eef2f7;color:var(--text)}
button.danger{background:#fff;color:var(--danger);border:1px solid #f0c2bd}
.big{width:100%;padding:17px;font-size:19px}
.prev{font-size:15px;line-height:1.55;background:#f8fafc;border:1px dashed var(--line);border-radius:12px;padding:12px}
.setrow{display:grid;grid-template-columns:46px 1fr 1fr 54px;gap:8px;align-items:center;margin:8px 0}
.setno{text-align:center;font-weight:700}
.smallbtn{padding:10px 8px;font-size:14px;border-radius:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{background:transparent;color:#64748b;padding:8px 4px;font-size:12px;font-weight:700}
.tab.active{color:var(--blue);background:#eff6ff}
.view{display:none}.view.active{display:block}
.history-item{padding:12px 0;border-bottom:1px solid #eee}
.history-item:last-child{border-bottom:0}
.history-title{font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.exercise-item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.exercise-item span{flex:1}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.inline-note{font-size:12px;color:var(--muted);margin-top:6px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{background:#eef2f7;border-radius:999px;padding:6px 10px;font-size:12px}
@media (max-width:420px){.setrow{grid-template-columns:40px 1fr 1fr 50px}}
</style>
</head>
<body>
<header><h1>筋トレ記録</h1></header>

<main>
<section id="record" class="view active">
  <div class="card" id="weeklyExportCard" style="display:none">
    <div class="label">週次CSV</div>
    <div id="weeklyExportMessage" class="prev"></div>
    <div style="height:10px"></div>
    <button id="weeklyExportButton" class="big">週次CSVを出力</button>
    <div style="height:8px"></div>
    <button id="weeklyExportDismiss" class="secondary big">今回は後で</button>
  </div>
  <div class="card">
    <div class="label">今日の体重・体脂肪率（任意）</div>
    <div class="grid2">
      <div>
        <input id="bodyWeight" type="number" step="0.1" inputmode="decimal" placeholder="体重 kg">
      </div>
      <div>
        <input id="bodyFat" type="number" step="0.1" inputmode="decimal" placeholder="体脂肪 %">
      </div>
    </div>
    <div class="inline-note">入力しない日は空欄のままでOKです。</div>
    <div style="height:10px"></div>
    <button id="saveBody" class="secondary big">今日の体組成を保存</button>
    <div id="bodySaved" class="inline-note"></div>
  </div>

  <div class="card">
    <div class="label">種目</div>
    <select id="exerciseSelect"></select>
    <div style="height:10px"></div>
    <div class="label">前回記録</div>
    <div id="previous" class="prev">種目を選択してください</div>
  </div>

  <div class="card">
    <div class="label">セットごとの記録</div>
    <div id="setRows"></div>
    <button id="addSet" class="secondary big">＋ セットを追加</button>
    <div style="height:12px"></div>
    <button id="saveWorkout" class="big">記録する</button>
  </div>

  <div class="card">
    <div class="label">今日の記録</div>
    <div id="todayList"></div>
  </div>
</section>

<section id="history" class="view">
  <div class="card">
    <div class="label">履歴</div>
    <div id="historyList"></div>
  </div>
</section>

<section id="exercises" class="view">
  <div class="card">
    <div class="label">新しい種目を追加</div>
    <input id="newExercise" placeholder="例：ベンチプレス">
    <div style="height:10px"></div>
    <button id="addExercise" class="big">種目を追加</button>
  </div>
  <div class="card">
    <div class="label">登録済み種目</div>
    <div id="exerciseList"></div>
  </div>
</section>

<section id="export" class="view">
  <div class="card">
    <div class="label">CSV出力</div>
    <p class="note">
      1セットを1行として、日付・体重・体脂肪率・種目・セット番号・重量・回数を書き出します。
      ExcelやChatGPTで分析しやすい形式です。
    </p>
    <button id="exportCsv" class="big">CSVを出力</button>
  </div>
  <div class="card">
    <div class="label">データ管理</div>
    <button id="clearAll" class="danger big">全記録を削除</button>
  </div>
</section>
</main>

<nav class="tabs">
  <button class="tab active" data-view="record">記録</button>
  <button class="tab" data-view="history">履歴</button>
  <button class="tab" data-view="exercises">種目</button>
  <button class="tab" data-view="export">CSV</button>
</nav>

<script>
const KEYS={
  ex:"workout_exercises_v2",
  logs:"workout_logs_v2",
  body:"workout_body_v2",
  weekly:"workout_weekly_exports_v1"
};
const defaultExercises=[
  "ベンチプレス","インクラインダンベルプレス","ダンベルフライ",
  "ラットプルダウン","シーテッドロー","ショルダープレス",
  "スクワット","レッグプレス","アームカール","トライセプスプレスダウン"
];

let exercises=JSON.parse(localStorage.getItem(KEYS.ex)||"null")||defaultExercises;
let logs=JSON.parse(localStorage.getItem(KEYS.logs)||"[]");
let body=JSON.parse(localStorage.getItem(KEYS.body)||"{}");
let currentSets=[];
let weeklyExports=JSON.parse(localStorage.getItem(KEYS.weekly)||"{}");

const $=id=>document.getElementById(id);
const todayStr=()=>new Date().toISOString().slice(0,10);
function save(){
  localStorage.setItem(KEYS.ex,JSON.stringify(exercises));
  localStorage.setItem(KEYS.logs,JSON.stringify(logs));
  localStorage.setItem(KEYS.body,JSON.stringify(body));
  localStorage.setItem(KEYS.weekly,JSON.stringify(weeklyExports));
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function makeOptions(start,end,step,suffix){
  let arr=[];
  for(let x=start;x<=end+1e-9;x+=step){
    let v=Math.round(x*10)/10;
    arr.push(`<option value="${v}">${v}${suffix}</option>`);
  }
  return arr.join("");
}

function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function weekSunday(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-x.getDay()); // Sunday = start
  return x;
}
function weekSaturday(d){
  const s=weekSunday(d);
  const e=new Date(s);
  e.setDate(e.getDate()+6);
  return e;
}
function makeCsvRows(start,end){
  const s=localDateStr(start), e=localDateStr(end);
  const rows=[["date","body_weight_kg","body_fat_pct","exercise","set_no","training_weight_kg","reps"]];
  logs.filter(x=>x.date>=s&&x.date<=e).forEach(log=>{
    const bd=body[log.date]||{};
    log.sets.forEach((set,i)=>rows.push([
      log.date, bd.weight??"", bd.bodyFat??"", log.exercise, i+1, set.weight, set.reps
    ]));
  });
  return rows;
}
function downloadCsv(rows,filename){
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportWeek(start,end){
  const rows=makeCsvRows(start,end);
  if(rows.length===1){ alert("この週のトレーニング記録はありません。"); return; }
  const s=localDateStr(start), e=localDateStr(end);
  downloadCsv(rows,`workout_${s}_to_${e}.csv`);
  weeklyExports[`${s}_to_${e}`]={exportedAt:new Date().toISOString()};
  save();
  checkWeeklyExport();
}
function pendingWeek(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const currentStart=weekSunday(today);
  const currentEnd=weekSaturday(today);

  if(today.getDay()===6){
    const s=localDateStr(currentStart), e=localDateStr(currentEnd), key=`${s}_to_${e}`;
    if(logs.some(x=>x.date>=s&&x.date<=e) && !weeklyExports[key]){
      return {start:currentStart,end:currentEnd,current:true};
    }
  }
  for(let i=1;i<=12;i++){
    const start=new Date(currentStart);
    start.setDate(start.getDate()-7*i);
    const end=new Date(start); end.setDate(end.getDate()+5);
    const s=localDateStr(start), e=localDateStr(end), key=`${s}_to_${e}`;
    if(logs.some(x=>x.date>=s&&x.date<=e) && !weeklyExports[key]){
      return {start,end,current:false};
    }
  }
  return null;
}
function checkWeeklyExport(){
  const p=pendingWeek();
  const card=$("weeklyExportCard");
  if(!p){ card.style.display="none"; return; }
  card.style.display="block";
  card.dataset.start=localDateStr(p.start);
  card.dataset.end=localDateStr(p.end);
  $("weeklyExportMessage").innerHTML=p.current
    ? `<strong>今日は土曜日です。</strong><br>${localDateStr(p.start)}〜${localDateStr(p.end)} の記録をCSV出力できます。`
    : `<strong>未出力の週があります。</strong><br>${localDateStr(p.start)}〜${localDateStr(p.end)} の記録をCSV出力できます。`;
}

function renderSetRows(){
  const wrap=$("setRows");
  wrap.innerHTML=currentSets.map((s,i)=>`
    <div class="setrow">
      <div class="setno">${i+1}</div>
      <select data-kind="weight" data-i="${i}">${makeOptions(0,200,2.5," kg")}</select>
      <select data-kind="reps" data-i="${i}">${makeOptions(1,30,1," 回")}</select>
      <button class="danger smallbtn" onclick="removeSet(${i})">×</button>
    </div>
  `).join("");
  currentSets.forEach((s,i)=>{
    const w=wrap.querySelector(`select[data-kind="weight"][data-i="${i}"]`);
    const r=wrap.querySelector(`select[data-kind="reps"][data-i="${i}"]`);
    w.value=String(s.weight); r.value=String(s.reps);
  });
  wrap.querySelectorAll("select").forEach(sel=>sel.addEventListener("change",e=>{
    const i=Number(e.target.dataset.i);
    currentSets[i][e.target.dataset.kind]=Number(e.target.value);
  }));
}
window.removeSet=(i)=>{
  if(currentSets.length<=1)return;
  currentSets.splice(i,1); renderSetRows();
}
function addSet(copyLast=true){
  const last=currentSets[currentSets.length-1];
  currentSets.push(copyLast && last ? {...last} : {weight:20,reps:10});
  renderSetRows();
}
function renderExercises(){
  const sel=$("exerciseSelect"), current=sel.value;
  sel.innerHTML='<option value="">種目を選択</option>'+exercises.map(e=>`<option>${esc(e)}</option>`).join("");
  if(exercises.includes(current))sel.value=current;
  $("exerciseList").innerHTML=exercises.length?exercises.map((e,i)=>`
    <div class="exercise-item">
      <span>${esc(e)}</span>
      <button class="secondary smallbtn" onclick="moveExercise(${i},-1)">↑</button>
      <button class="secondary smallbtn" onclick="moveExercise(${i},1)">↓</button>
      <button class="danger smallbtn" onclick="deleteExercise(${i})">削除</button>
    </div>`).join(""):'<div class="empty">種目がありません</div>';
  updatePrevious();
}
window.moveExercise=(i,d)=>{const j=i+d;if(j<0||j>=exercises.length)return;[exercises[i],exercises[j]]=[exercises[j],exercises[i]];save();renderExercises();}
window.deleteExercise=(i)=>{if(confirm("この種目を削除しますか？")){exercises.splice(i,1);save();renderExercises();}}
function updatePrevious(){
  const ex=$("exerciseSelect").value;
  if(!ex){$("previous").textContent="種目を選択してください";return;}
  const prev=[...logs].reverse().find(x=>x.exercise===ex);
  if(!prev){$("previous").textContent="この種目の記録はまだありません";return;}
  $("previous").innerHTML=`<strong>${esc(prev.date)}</strong><br>`+
    prev.sets.map((s,i)=>`${i+1}セット目：${s.weight}kg × ${s.reps}回`).join("<br>");
}
function loadTodayBody(){
  const d=body[todayStr()];
  $("bodyWeight").value=d?.weight ?? "";
  $("bodyFat").value=d?.bodyFat ?? "";
  $("bodySaved").textContent=d ? "保存済み" : "";
}
function renderToday(){
  const today=todayStr();
  const arr=logs.filter(x=>x.date===today).reverse();
  const bd=body[today];
  let top="";
  if(bd){
    const parts=[];
    if(bd.weight!==null && bd.weight!=="")parts.push(`体重 ${bd.weight}kg`);
    if(bd.bodyFat!==null && bd.bodyFat!=="")parts.push(`体脂肪 ${bd.bodyFat}%`);
    if(parts.length)top=`<div class="summary">${parts.map(p=>`<span class="pill">${p}</span>`).join("")}</div>`;
  }
  $("todayList").innerHTML=top+(arr.length?arr.map(x=>`
    <div class="history-item">
      <div class="history-title">${esc(x.exercise)}</div>
      <div>${x.sets.map((s,i)=>`${i+1}set ${s.weight}kg×${s.reps}`).join(" / ")}</div>
      <div class="meta">${esc(x.time||"")}</div>
    </div>`).join(""):'<div class="empty">まだトレーニング記録がありません</div>');
}
function renderHistory(){
  const grouped={};
  [...logs].reverse().forEach(x=>{(grouped[x.date] ||= []).push(x)});
  const dates=Object.keys(grouped).sort().reverse();
  $("historyList").innerHTML=dates.length?dates.map(date=>{
    const bd=body[date];
    const btxt=bd ? [bd.weight!==""&&bd.weight!=null?`体重 ${bd.weight}kg`:"",bd.bodyFat!==""&&bd.bodyFat!=null?`体脂肪 ${bd.bodyFat}%`:""].filter(Boolean).join(" / ") : "";
    return `<div class="history-item">
      <div class="history-title">${esc(date)}</div>
      ${btxt?`<div class="meta">${esc(btxt)}</div>`:""}
      ${grouped[date].map(x=>`<div style="margin-top:8px"><strong>${esc(x.exercise)}</strong><br>${x.sets.map((s,i)=>`${i+1}set ${s.weight}kg×${s.reps}`).join(" / ")}</div>`).join("")}
    </div>`;
  }).join(""):'<div class="empty">履歴がありません</div>';
}
$("exerciseSelect").addEventListener("change",updatePrevious);
$("addSet").addEventListener("click",()=>addSet(true));
$("addExercise").addEventListener("click",()=>{
  const v=$("newExercise").value.trim(); if(!v)return;
  if(exercises.includes(v)){alert("同じ種目が登録されています");return;}
  exercises.push(v);$("newExercise").value="";save();renderExercises();
});
$("saveBody").addEventListener("click",()=>{
  const w=$("bodyWeight").value;
  const f=$("bodyFat").value;
  if(w==="" && f===""){ delete body[todayStr()]; }
  else body[todayStr()]={weight:w===""?"":Number(w),bodyFat:f===""?"":Number(f)};
  save(); $("bodySaved").textContent="保存しました ✓"; renderToday(); renderHistory(); checkWeeklyExport();
});
$("saveWorkout").addEventListener("click",()=>{
  const ex=$("exerciseSelect").value;
  if(!ex){alert("種目を選んでください");return;}
  const now=new Date();
  logs.push({
    date:todayStr(),
    time:now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),
    exercise:ex,
    sets:currentSets.map(x=>({...x}))
  });
  save();renderToday();renderHistory();updatePrevious();checkWeeklyExport();
  const b=$("saveWorkout"),old=b.textContent;b.textContent="記録しました ✓";setTimeout(()=>b.textContent=old,900);
});
$("exportCsv").addEventListener("click",()=>{
  const rows=[["date","body_weight_kg","body_fat_pct","exercise","set_no","training_weight_kg","reps"]];
  logs.forEach(log=>{
    const bd=body[log.date]||{};
    log.sets.forEach((s,i)=>rows.push([
      log.date,
      bd.weight ?? "",
      bd.bodyFat ?? "",
      log.exercise,
      i+1,
      s.weight,
      s.reps
    ]));
  });
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`workout_all_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$("weeklyExportButton").addEventListener("click",()=>{
  const card=$("weeklyExportCard");
  if(!card.dataset.start)return;
  exportWeek(new Date(card.dataset.start+"T00:00:00"),new Date(card.dataset.end+"T00:00:00"));
});
$("weeklyExportDismiss").addEventListener("click",()=>{
  $("weeklyExportCard").style.display="none";
});
$("clearAll").addEventListener("click",()=>{
  if(confirm("すべてのトレーニング記録・体重・体脂肪率を削除しますか？")){
    logs=[];body={};save();renderToday();renderHistory();loadTodayBody();updatePrevious();
  }
});
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(btn.dataset.view).classList.add("active");
  if(btn.dataset.view==="history")renderHistory();
}));
currentSets=[{weight:20,reps:10},{weight:20,reps:10},{weight:20,reps:10}];
renderSetRows();renderExercises();loadTodayBody();renderToday();renderHistory();checkWeeklyExport();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
